services:
  claude-code-python:
    command:
      - bash
      - -c
      - bash tests/smoke.sh && uv run hello_world.py
  claude-code-playwright-python:
    command:
      - bash
      - -c
      # `playwright install` covers the case that the Playwright resolved by uv is newer than
      # the browsers bundled in the official base image.
      - >-
        bash tests/smoke.sh
        && uv run --directory tests/playwright playwright install chromium
        && uv run --directory tests/playwright pytest
